image:
  repository: danny-avila/librechat
  registry: ghcr.io
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations:
  namespace: "librechat"

deploymentAnnotations:
  namespace: "librechat"

service:
  type: ClusterIP
  port: 3080
  targetPort: 3080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: chat.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

mongodb:
  enabled: false # true
  # auth:
  #   enabled: false
  # databases:
  #   - LibreChat
  # image:
  #   registry: registry-1.docker.io
  #   repository: bitnamilegacy/mongodb
  #   tag: "latest"

meilisearch:
  enabled: true
  persistence:
    enabled: false
  image:
    tag: "v1.7.3"
  auth:
    existingMasterKeySecret: "librechat-credentials-env"

redis:
  enabled: false
