replicaCount: 1

global:
  librechat:
    existingSecretName: "librechat-credentials-env"
    existingSecretApiKey: OPENAI_API_KEY
    env:
      # - name: ENDPOINTS
      #   value: "openAI,azureOpenAI,google,anthropic,agents"
      - name: CAMER_AI_API_KEY
        valueFrom:
          secretKeyRef:
            name: librechat-api-key
            key: OPENAI_API_KEY
  security:
    allowInsecureImages: true

librechat:
  configEnv:
    existingSecretName: "librechat-credentials-env"
    MONGO_URI: "mongodb://mongodb.librechat.svc.cluster.local:27017/LibreChat"
    ALLOW_REGISTRATION: "true"
    ALLOW_EMAIL_LOGIN: "true"
    SEARCH: "true"
    MEILI_HOST: "http://librechat-meilisearch:7700"
    NO_INDEX: "true"
  registration:
  configYamlContent: |
    version: 1.3.5
    cache: true
    fileStrategy: "local"
    interface:
      endpointsMenu: true
      modelSelect: true
      parameters: true
      presets: true
      # agents:
      #   use: true
      #   create: true
      #   share: true
      #   public: true
      # mcpServers:
      #   use: true
      #   create: true
      #   share: false
      #   public: false

    endpoints:
      all:
        streamRate: 5
        titlePromptTemplate: |
          ### Task:
          Generate a concise 3-5 word title summarizing the conversation.

          ### Rules:
          - Match the main topic.
          - Keep it short and clear.
          - Use the chat's primary language.
          - Avoid quotes and markdown.

          ### Chat History:
          Human: {input}
          Assistant: {output}
      # agents:
      #   allowedProviders:
      #     - "Camer AI"
      #   capabilities:
      #     - "chain"
      #     - "tools"
      #     - "actions"
      #     - "file_search"
      #     - "context"
      #     - "web_search"
      #     - "execute_code"
      #     - "artifacts"
      #     - "ocr"
      #   recursionLimit: 50
      #   maxRecursionLimit: 100
      #   disableBuilder: false
      #   maxCitations: 10
      #   maxCitationsPerFile: 4
      #   minRelevanceScore: 0.35
      # assistants:
      #   disableBuilder: false
      #   pollIntervalMs: 750
      #   timeoutMs: 180000
      custom:
        - name: "Camer AI"
          apiKey: "${CAMER_AI_API_KEY}"
          baseURL: "https://api.ai.camer.digital/v1"
          models:
            default:
              - "gemma-4"
              - "glm-5"
            fetch: false
          titleConvo: true
          titleMethod: "completion"
          titleModel: "qwen3-8b"
          summarize: true
          summaryModel: "gemini-3.1-flash-lite"
          modelDisplayLabel: "Camer AI"
          dropParams: ["stop", "user"]

