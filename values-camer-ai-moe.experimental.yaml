librechat:
  configYamlContent: |
    version: 1.3.5
    cache: true
    fileStrategy: "local"
    interface:
      endpointsMenu: true
      modelSelect: true
      parameters: true
      presets: true
      agents: true
    endpoints:
      all:
        streamRate: 5
        titlePromptTemplate: |
          ### Task:
          Generate a concise 3-5 word title summarizing the conversation.

          ### Rules:
          - Match the main topic.
          - Keep it short and clear.
          - Use the chat's primary language.
          - Avoid quotes and markdown.

          ### Chat History:
          Human: {input}
          Assistant: {output}
      agents:
        recursionLimit: 30
        maxRecursionLimit: 50
        disableBuilder: false
        maxCitations: 10
        maxCitationsPerFile: 4
        minRelevanceScore: 0.35
      assistants:
        disableBuilder: false
        pollIntervalMs: 750
        timeoutMs: 180000
      custom:
        - name: "Camer AI"
          apiKey: "${CAMER_AI_API_KEY}"
          baseURL: "https://api.ai.camer.digital/v1"
          models:
            default:
              - "qwen3-8b"
              - "qwen3-vl-30b-a3b-thinking"
              - "qwen3-vl-30b-a3b-instruct"
              - "qwen3-reranker-8b"
              - "gemini-2.5-pro"
              - "gemini-2.5-flash"
              - "gemini-2.5-flash-lite"
              - "gemini-3-flash"
              - "gemini-3.1-pro"
              - "gemini-3.1-flash-lite"
              - "deepseek-v3p2"
              - "kimi-k2.5"
              - "kimi-k2-instruct-0905"
              - "kimi-k2-thinking"
              - "cogito-671b-v2-p1"
            fetch: false

          titleConvo: true
          titleMethod: "completion"
          titleModel: "qwen3-8b"
          summarize: true
          summaryModel: "qwen3-8b"
          modelDisplayLabel: "Camer AI"
          dropParams: ["stop", "user"]
    fileConfig:
      endpoints:
        assistants:
          fileLimit: 5
          fileSizeLimit: 10
          totalSizeLimit: 50
          supportedMimeTypes:
            - "image/.*"
            - "application/pdf"
        default:
          totalSizeLimit: 20
      serverFileSizeLimit: 100
      avatarSizeLimit: 2
    rateLimits:
      fileUploads:
        ipMax: 100
        ipWindowInMinutes: 60
        userMax: 50
        userWindowInMinutes: 60
    modelSpecs:
      enforce: false
      prioritize: false
      list:
        - name: "moe-orchestrator"
          label: "MoE Orchestrator"
          group: "Camer AI"
          description: "Primary coordinator that routes work across specialist models and synthesizes the final answer."
          preset:
            endpoint: "Camer AI"
            model: "qwen3-vl-30b-a3b-instruct"
            temperature: 0.2
            promptPrefix: |
              You are the orchestrator in a Mixture-of-Experts workflow.
              Your job is to:
              1. clarify the task and constraints,
              2. decide which specialists should contribute,
              3. compare specialist outputs critically,
              4. resolve disagreements,
              5. produce one final, actionable answer.

              Output sections:
              - Task framing
              - Constraints
              - Specialist routing plan
              - Compared recommendations
              - Final answer
              - Risks and follow-up

        - name: "moe-strategy"
          label: "Strategy Expert"
          group: "Camer AI"
          description: "Produces strong solution directions and trade-offs."
          preset:
            endpoint: "Camer AI"
            model: "kimi-k2.5"
            temperature: 0.6
            promptPrefix: |
              You are the Strategy expert.
              Produce 3 strong solution options.
              For each option include:
              - core idea
              - why it fits
              - trade-offs
              - implementation complexity

        - name: "moe-creative"
          label: "Creative Expert"
          group: "Camer AI"
          description: "Explores broader and unconventional alternatives."
          preset:
            endpoint: "Camer AI"
            model: "cogito-671b-v2-p1"
            temperature: 0.9
            promptPrefix: |
              You are the Creative expert.
              Generate diverse alternatives, including:
              - standard option
              - low-cost option
              - high-upside option
              - unconventional but plausible option
              - fallback option

        - name: "moe-analysis"
          label: "Analysis Expert"
          group: "Camer AI"
          description: "Stress-tests ideas for feasibility, risks, and hidden assumptions."
          preset:
            endpoint: "Camer AI"
            model: "deepseek-v3p2"
            temperature: 0.1
            promptPrefix: |
              You are the Analysis expert.
              Critically evaluate each proposal.
              Include:
              - hidden assumptions
              - failure modes
              - cost and scaling risks
              - maintainability concerns
              - recommendation

        - name: "moe-vision"
          label: "Vision Expert"
          group: "Camer AI"
          description: "Best for multimodal tasks, UI critique, screenshots, and document-heavy reasoning."
          preset:
            endpoint: "Camer AI"
            model: "qwen3-vl-30b-a3b-thinking"
            temperature: 0.2
            promptPrefix: |
              You are the Vision expert.
              Focus on multimodal understanding.
              When images, screenshots, PDFs, or layouts are involved:
              - extract the important details
              - identify inconsistencies
              - explain findings clearly

        - name: "moe-fast"
          label: "Fast Expert"
          group: "Camer AI"
          description: "Low-latency helper for quick drafting, summaries, and classification."
          preset:
            endpoint: "Camer AI"
            model: "qwen3-8b"
            temperature: 0.2
            promptPrefix: |
              You are the Fast expert.
              Be concise, structured, and efficient.
              Prefer direct answers and compact summaries.
